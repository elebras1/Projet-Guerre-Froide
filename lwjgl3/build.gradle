
buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath "io.github.fourlastor:construo:2.3.0"
    if(enableGraalNative == 'true') {
      classpath "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin:1.1.14"
    }
  }
}
plugins {
  id "application"
}
apply plugin: 'io.github.fourlastor.construo'


import io.github.fourlastor.construo.Target

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application {
  mainClass = 'com.populaire.projetguerrefroide.lwjgl3.Launcher'
}

eclipse.project.name = appName + '-lwjgl3'
java {
  toolchain {
    languageVersion.set(JavaLanguageVersion.of(25))
  }
}

if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(25)
}

dependencies {
  implementation project(':core')
  testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
  testImplementation "org.junit.jupiter:junit-jupiter-engine:6.1.3"
  testImplementation "org.junit.platform:junit-platform-launcher:6.1.3"
  testImplementation "org.mockito:mockito-core:5.24.0"
}

test {
  useJUnitPlatform()
  workingDir = rootProject.file('assets').path
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
  systemProperty "simulation.outputDir", project.findProperty("simulation.outputDir") ?: file("build/simulation-analysis").absolutePath
  if (project.hasProperty("simulation.outputDir")) {
    def resultsDir = "${project.property('simulation.outputDir')}-test-results"
    reports.junitXml.outputLocation = file(resultsDir)
    reports.html.outputLocation = file("${resultsDir}/html")
    binaryResultsDirectory = file("${resultsDir}/binary")
  }
  systemProperty "simulation.years", project.findProperty("simulation.years") ?: "5"
  systemProperty "simulation.detailEvery", project.findProperty("simulation.detailEvery") ?: ""
  systemProperty "simulation.freeze", project.findProperty("simulation.freeze") ?: ""
  systemProperty "simulation.laws", project.findProperty("simulation.laws") ?: ""
  systemProperty "simulation.threads", project.findProperty("simulation.threads") ?: "1"
}

def os = System.properties['os.name'].toLowerCase()

run {
  workingDir = rootProject.file('assets').path
  setIgnoreExitValue(true)

  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
  jvmArgs += "-XX:+UseCompactObjectHeaders"
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
}

jar {
// sets the name of the .jar file this produces to the name of the game or app, with the version after.
  archiveFileName.set("${appName}-${projectVersion}.jar")
// the duplicatesStrategy matters starting in Gradle 7.0; this setting works.
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
// these "exclude" lines remove some unnecessary duplicate files in the output JAR.
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
// setting the manifest makes the JAR runnable.
  manifest {
    attributes(
      'Main-Class': application.mainClass.get(),
      'Enable-Native-Access': 'ALL-UNNAMED'
    )
  }
// this last step may help on some OSes that need extra instruction to make runnable JARs.
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

def graalVmArchive = "https://gds.oracle.com/download/graal/25i5/archive/graalvm-jdk-25i5-25.0.5.0.3"

construo {
  name.set(appName)
  humanName.set(appName)

  roast {
    useZgc.set(false)
    vmArgs.addAll("-XX:+UseCompactObjectHeaders", "--enable-native-access=ALL-UNNAMED")
  }

  targets.configure {
    create("linuxX64", Target.Linux) {
      architecture.set(Target.Architecture.X86_64)
      jdkUrl.set(graalVmArchive + "_linux-x64_bin.tar.gz")
      jdkSha256.set("90582f405cb89a825a43297cdacc7f427ce04039a249f5f0fc75c95b50600b08")
    }
    create("macM1", Target.MacOs) {
      architecture.set(Target.Architecture.AARCH64)
      jdkUrl.set(graalVmArchive + "_macos-aarch64_bin.tar.gz")
      jdkSha256.set("3c51d8ef62c63eb8454727f32d67aaff39afabe4c90b3c811c11547029c10819")
      identifier.set("com.populaire.projetguerrefroide." + appName)
      macIcon.set(project.file("icons/logo.icns"))
    }
    create("winX64", Target.Windows) {
      architecture.set(Target.Architecture.X86_64)
      jdkUrl.set(graalVmArchive + "_windows-x64_bin.zip")
      jdkSha256.set("dc28ad6ea38a24768c10571b47fbee84318f0f0c64883237efbba26cfc5cede0")
    }
  }

  def hostTarget = os.contains('win') ? 'WinX64' : os.contains('mac') ? 'MacM1' : 'LinuxX64'
  jdkRoot.set(tasks.named("unzipJdk" + hostTarget).flatMap { it.outputDirectory })
}

// Equivalent to the jar task; here for compatibility with gdx-setup.
tasks.register('dist') {
  dependsOn 'jar'
}

distributions {
  main {
    contents {
      into('libs') {
        project.configurations.runtimeClasspath.files.findAll { file ->
          file.getName() != project.tasks.jar.outputs.files.singleFile.name
        }.each { file ->
          exclude file.name
        }
      }
    }
  }
}

startScripts.dependsOn(':lwjgl3:jar')
startScripts.classpath = project.tasks.jar.outputs.files

if(enableGraalNative == 'true') {
  apply from: file("nativeimage.gradle")
}
