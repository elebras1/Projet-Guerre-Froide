buildscript {
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  }
  dependencies {
    classpath 'io.github.elebras1:gdx-skin-weaver:0.3.4'
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java {
    toolchain {
      languageVersion.set(JavaLanguageVersion.of(25))
    }
  }

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = '$projectVersion'
  ext.appName = 'ProjetGuerreFroide'
  repositories {
    maven { url = uri("https://central.sonatype.com/repository/maven-snapshots/") }
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }

  dependencies {
    implementation 'io.github.monstroussoftware.gdx-webgpu:gdx-webgpu:-SNAPSHOT'
    implementation 'io.github.monstroussoftware.gdx-webgpu:backend-desktop-ffm-wgpu:-SNAPSHOT'
    implementation 'com.github.tommyettinger:jdkgdxds:2.1.9'
    implementation 'com.dslplatform:dsl-json:2.0.2'
    annotationProcessor 'com.dslplatform:dsl-json:2.0.2'
    implementation 'io.github.elebras1:flecs-java:1.1.1'
    annotationProcessor 'io.github.elebras1:flecs-java:1.1.1'
  }
}

eclipse.project.name = 'ProjetGuerreFroide' + '-parent'
